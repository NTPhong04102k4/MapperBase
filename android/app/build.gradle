import groovy.json.JsonSlurper

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "org.jetbrains.kotlin.plugin.compose"   // cần cho Glance widget (Jetpack Compose)
apply plugin: "com.facebook.react"

// google-services chỉ apply khi thật sự có file config, để base vẫn build được
// khi chưa tải google-services.json về (xem android/app/src/<flavor>/README.md).
def hasAnyGoogleServices = ["dev", "staging", "prod"].any {
    file("src/${it}/google-services.json").exists()
}
if (hasAnyGoogleServices) {
    apply plugin: "com.google.gms.google-services"
}

/* ------------------------------------------------------------------ *
 *  NGUỒN SỰ THẬT VERSION = package.json
 *
 *    "version": "1.2.3"                                  <- versionName, chung
 *    "buildNumbers": { "dev": 46, "staging": 12, ... }   <- versionCode, TÁCH
 *
 *  Không bao giờ sửa versionCode/versionName trong file này nữa.
 *  Đổi số: `yarn bump:dev` / `yarn bump:prod` / `yarn release:patch`
 *  Giải thích + phương án dùng chung 1 counter: docs/06-FLAVOR-BUILD-NUMBER.md
 * ------------------------------------------------------------------ */
def appPkg = new JsonSlurper().parseText(file("../../package.json").text)
def appVersionName = appPkg.version as String
def buildNumberOf = { String flavor ->
    def n = appPkg.buildNumbers?.get(flavor)
    if (n == null) {
        throw new GradleException(
            "package.json thiếu buildNumbers.${flavor}. Chạy `yarn version:sync` hoặc thêm tay.")
    }
    return n as Integer
}

/* ------------------------------------------------------------------ *
 *  Ký release: đọc từ android/keystore.properties (KHÔNG commit file này).
 *  Chưa có file -> release fallback về debug key + cảnh báo to đùng.
 * ------------------------------------------------------------------ */
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
def hasReleaseKeystore = keystorePropsFile.exists()
if (hasReleaseKeystore) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

react {
    autolinkLibrariesWithApp()
    // Có flavor thì phải liệt kê đủ variant debug, nếu không RN sẽ cố bundle JS cho bản debug.
    debuggableVariants = ["devDebug", "stagingDebug", "prodDebug"]
}

def enableProguardInReleaseBuilds = true
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.mapper"

    defaultConfig {
        applicationId "com.mapper"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // versionCode được set riêng ở từng productFlavor bên dưới.
        versionName appVersionName
        resValue "string", "app_version", "${appVersionName}"
    }

    buildFeatures {
        buildConfig true
        compose true      // Glance widget
    }

    /* -------------------------------------------------------------- *
     *  FLAVOR: dev / staging / prod
     *  Mỗi flavor = 1 app record riêng trên Play Console (chốt ở docs/05).
     *  Mỗi flavor × 2 buildType (debug, release) = 6 variant.
     *
     *  KHÔNG đặt applicationIdSuffix cho buildType debug: applicationId phải
     *  khớp đúng client trong google-services.json, thêm ".debug" là plugin
     *  google-services báo "No matching client found".
     * -------------------------------------------------------------- */
    flavorDimensions += "env"
    productFlavors {
        dev {
            dimension "env"
            applicationIdSuffix ".dev"
            versionCode buildNumberOf("dev")
            resValue "string", "app_name", "Mapper Dev"
            resValue "string", "build_number", "${buildNumberOf('dev')}"
            buildConfigField "String", "FLAVOR_ENV", '"dev"'
            buildConfigField "String", "API_BASE_URL", '"https://dev.hrapi.ttmedic.vn:443"'
            buildConfigField "String", "FORGEROCK_URL", '"https://dev.hrapi.ttmedic.vn:443/am"'
            buildConfigField "String", "FORGEROCK_REALM", '"alpha"'
            buildConfigField "String", "SEPAY_ENV", '"sandbox"'
            buildConfigField "int", "WIDGET_REFRESH_MINUTES", "1"
            manifestPlaceholders = [
                appScheme          : "mapperdev",
                facebookAppId      : project.findProperty("FACEBOOK_APP_ID_DEV") ?: "0",
                facebookClientToken: project.findProperty("FACEBOOK_CLIENT_TOKEN_DEV") ?: "",
            ]
        }
        staging {
            dimension "env"
            applicationIdSuffix ".staging"
            versionCode buildNumberOf("staging")
            resValue "string", "app_name", "Mapper Staging"
            resValue "string", "build_number", "${buildNumberOf('staging')}"
            buildConfigField "String", "FLAVOR_ENV", '"staging"'
            buildConfigField "String", "API_BASE_URL", '"https://staging.hrapi.ttmedic.vn:443"'
            buildConfigField "String", "FORGEROCK_URL", '"https://staging.hrapi.ttmedic.vn:443/am"'
            buildConfigField "String", "FORGEROCK_REALM", '"alpha"'
            buildConfigField "String", "SEPAY_ENV", '"sandbox"'
            buildConfigField "int", "WIDGET_REFRESH_MINUTES", "5"
            manifestPlaceholders = [
                appScheme          : "mapperstg",
                facebookAppId      : project.findProperty("FACEBOOK_APP_ID_STAGING") ?: "0",
                facebookClientToken: project.findProperty("FACEBOOK_CLIENT_TOKEN_STAGING") ?: "",
            ]
        }
        prod {
            dimension "env"
            // không suffix -> com.mapper
            versionCode buildNumberOf("prod")
            resValue "string", "app_name", "Mapper"
            resValue "string", "build_number", "${buildNumberOf('prod')}"
            buildConfigField "String", "FLAVOR_ENV", '"prod"'
            buildConfigField "String", "API_BASE_URL", '"https://hrapi.ttmedic.vn:443"'
            buildConfigField "String", "FORGEROCK_URL", '"https://hrapi.ttmedic.vn:443/am"'
            buildConfigField "String", "FORGEROCK_REALM", '"alpha"'
            buildConfigField "String", "SEPAY_ENV", '"production"'
            buildConfigField "int", "WIDGET_REFRESH_MINUTES", "5"
            manifestPlaceholders = [
                appScheme          : "mapper",
                facebookAppId      : project.findProperty("FACEBOOK_APP_ID_PROD") ?: "0",
                facebookClientToken: project.findProperty("FACEBOOK_CLIENT_TOKEN_PROD") ?: "",
            ]
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasReleaseKeystore) {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            versionNameSuffix "-debug"
        }
        release {
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            } else {
                // Cố tình KHÔNG im lặng: ký release bằng debug key là lỗi chặn phát hành.
                logger.warn("\n[Mapper] ⚠️  Không tìm thấy android/keystore.properties — " +
                        "release đang ký bằng DEBUG KEY. Không được upload bản này lên Play.\n")
                signingConfig signingConfigs.debug
            }
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    // Tên file output đọc được ngay: Mapper-dev-1.0.0-46-release.apk
    applicationVariants.configureEach { variant ->
        def vc = buildNumberOf(variant.flavorName)
        variant.outputs.configureEach { output ->
            if (output.hasProperty("outputFileName") && output.outputFileName.endsWith(".apk")) {
                output.outputFileName =
                        "Mapper-${variant.flavorName}-${appVersionName}-${vc}-${variant.buildType.name}.apk"
            }
        }
    }

    packagingOptions {
        resources {
            excludes += ["META-INF/DEPENDENCIES", "META-INF/LICENSE*", "META-INF/NOTICE*"]
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    // --- AndroidX nền ---
    implementation("androidx.core:core-ktx:1.13.1")
    implementation("androidx.appcompat:appcompat:1.7.0")
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")

    // --- Splash screen (Android 12+ API, backport tới API 21) ---
    implementation("androidx.core:core-splashscreen:1.0.1")

    // --- Biometric mức 2 + mức 3 (ký số challenge) ---
    implementation("androidx.biometric:biometric:1.1.0")

    // --- ForgeRock IAM SDK ---
    implementation("org.forgerock:forgerock-auth:4.8.1")

    // --- Widget: Jetpack Glance (AppWidget viết bằng Compose) ---
    implementation(platform("androidx.compose:compose-bom:2024.09.03"))
    implementation("androidx.glance:glance-appwidget:1.1.0")
    implementation("androidx.glance:glance-material3:1.1.0")
    implementation("androidx.work:work-runtime-ktx:2.9.1")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
